server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # o proxy da frente (Nginx/Caddy do host) cuida do TLS
  server_tokens off;

  include /etc/nginx/snippets/security-headers.conf;

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;

  # assets com hash no nome: cache agressivo.
  # "^~" para ter precedência sobre o regex de extensões abaixo.
  location ^~ /assets/ {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  location ~* \.(?:svg|jpg|jpeg|png|webp|woff2|pdf|ico)$ {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=2592000" always;
    try_files $uri =404;
  }

  # HTML nunca em cache, senão o deploy novo não aparece
  location = /index.html {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache, must-revalidate" always;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  location = /healthz {
    access_log off;
    return 200 "ok\n";
  }
}

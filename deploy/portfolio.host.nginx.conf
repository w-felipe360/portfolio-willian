# Vhost do HOST (fora do container). Trocar SEU_DOMINIO antes de usar.
# Salvar em /etc/nginx/sites-available/portfolio e linkar em sites-enabled.
# Depois: sudo certbot --nginx -d SEU_DOMINIO -d www.SEU_DOMINIO

server {
  listen 80;
  listen [::]:80;
  server_name SEU_DOMINIO www.SEU_DOMINIO;

  # certbot substitui este bloco pelo redirect 301 para HTTPS
  location / {
    proxy_pass http://127.0.0.1:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
